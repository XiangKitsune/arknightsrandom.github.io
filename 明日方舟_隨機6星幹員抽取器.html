<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>明日方舟 隨機6★幹員抽取器</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to bottom, #0f0c29, #302b63, #24243e);
            color: #fff;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        h1 {
            color: #ffd700;
            text-shadow: 0 0 10px #ff4500;
            margin: 30px 0;
        }
        #operator {
            font-size: 3.5em;
            font-weight: bold;
            margin: 40px 0;
            min-height: 100px;
            color: #00ffff;
            text-shadow: 0 0 15px #00ffff, 0 0 30px #00bfff;
            transition: all 0.5s;
        }
        button {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            border: none;
            color: white;
            padding: 15px 40px;
            font-size: 1.5em;
            border-radius: 50px;
            cursor: pointer;
            margin: 20px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.4);
            transition: all 0.3s;
        }
        button:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(255, 65, 108, 0.6);
        }
        #count {
            font-size: 1.4em;
            margin: 20px 0;
            color: #ffff99;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        footer {
            margin-top: 60px;
            font-size: 0.9em;
            color: #aaa;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>明日方舟 隨機6★幹員抽取器</h1>
        <p>點擊按鈕，抽取一位隨機的6★幹員！（資料來自你提供的台服到電弧名單）</p>
        
        <div id="operator">準備好了嗎？點擊抽取！</div>
        
        <button onclick="drawOperator()">抽取一位6★幹員！</button>
        <button onclick="drawOperator()" style="background: linear-gradient(45deg, #00b4db, #0083b0);">再抽一次！</button>
        
        <div id="count">已抽取次數：0</div>
    </div>

    <footer>台服6★幹員數量 ≈ 120+（到電弧活動為止）</footer>

    <script>
        const operators = [
            "電弧", "司霆驚蟄", "酒神", "新約能天使", "信仰攪拌機", "Mon3tr", "死芒", "隱德來希", "餘", "燭煌",
            "引星棘刺", "荒蕪拉普蘭德", "忍冬", "弒君者", "維娜·維多利亞", "瑪露西爾", "佩佩", "娜仁圖亞", "妮芙",
            "烏爾比安", "維什戴爾", "邏各斯", "魔王", "阿斯卡綸", "艾拉", "黍", "左樂", "萊伊", "鐧", "塑心",
            "薇薇安娜", "止頌", "赫德雷", "滌火傑西卡", "純燼艾雅法拉", "琳瑯詩懷雅", "提豐", "聖約送葬人",
            "繆爾賽思", "霍爾海雅", "淬羽赫默", "伊內絲", "麒麟R夜刀", "仇白", "重岳", "林", "焰影葦草",
            "緘默德克薩斯", "斥罪", "白鐵", "瑪恩納", "百煉嘉維爾", "鴻雪", "多蘿西", "黑鍵", "歸溟幽靈鯊",
            "艾麗妮", "流明", "號角", "菲亞梅塔", "澄閃", "令", "老鯉", "靈知", "耀騎士臨光", "焰尾", "遠牙",
            "琴柳", "假日威龍陳", "水月", "帕拉斯", "卡涅利安", "濁心斯卡蒂", "凱爾希", "歌蕾蒂婭", "異客",
            "灰燼", "夕", "嵯峨", "空弦", "山", "迷迭香", "泥岩", "瑕光", "史爾特爾", "森蚺", "棘刺", "鈴蘭",
            "早露", "W", "溫蒂", "傀影", "風笛", "刻俄柏", "年", "煌", "阿", "莫斯提馬", "麥哲倫", "赫拉格",
            "黑", "陳", "斯卡蒂", "銀灰", "塞雷婭", "星熊", "夜鶯", "閃靈", "安潔莉娜", "艾雅法拉", "伊芙利特",
            "推進之王", "能天使"
        ];

        let drawCount = 0;

        function drawOperator() {
            const randomIndex = Math.floor(Math.random() * operators.length);
            const selected = operators[randomIndex];
            
            const display = document.getElementById('operator');
            display.style.opacity = 0;
            
            setTimeout(() => {
                display.textContent = selected;
                display.style.opacity = 1;
            }, 300);

            drawCount++;
            document.getElementById('count').textContent = `已抽取次數：${drawCount}`;
        }
    </script>
</body>
</html>
