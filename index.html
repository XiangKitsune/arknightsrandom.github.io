<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRTS 隨機 6★ 幹員</title>

<style>
body{
    margin:0;
    font-family:system-ui,-apple-system,BlinkMacSystemFont;
    background:linear-gradient(135deg,#0a0f1c,#16233a);
    color:#d6f0ff;
    text-align:center;
}
h1{color:#66d9ff;margin:16px 0}

.page{display:none}
.page.active{display:block}

#operator{
    margin:20px auto;
    padding:26px;
    max-width:560px;
    font-size:1.9em;
    background:rgba(0,0,0,.45);
    border:1px solid #3fbfff;
    border-radius:12px;
    box-shadow:0 0 20px rgba(63,191,255,.35);
}
.flash{animation:flash .35s}
@keyframes flash{
    0%{transform:scale(.9);opacity:.5}
    100%{transform:scale(1);opacity:1}
}

button{
    margin:5px;
    padding:10px 16px;
    background:#0f1f35;
    border:1px solid #3fbfff;
    color:#9be7ff;
    border-radius:8px;
    cursor:pointer;
}
button:hover{background:#1b3e66}

input[type=number]{
    width:64px;
    padding:6px;
    background:#111;
    color:#9be7ff;
    border:1px solid #3fbfff;
    border-radius:6px;
    text-align:center;
}

.panel{
    width:94%;
    max-width:960px;
    margin:14px auto;
    background:#111827;
    border:1px solid #2b4c7e;
    border-radius:10px;
}
.panel-header{
    padding:12px;
    cursor:pointer;
    background:#0f1f35;
}
.panel-content{
    display:none;
    padding:12px;
    text-align:left;
    max-height:420px;
    overflow:auto;
}

.history-item{
    border-bottom:1px solid #1e3a5f;
    padding:4px 0;
}

/* ===== 排除清單（響應式） ===== */
.exclude-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px 14px;
    font-size:0.9em;
}
.exclude-grid label{
    cursor:pointer;
    white-space:nowrap;
}
@media(max-width:900px){
    .exclude-grid{grid-template-columns:repeat(2,1fr);}
}
@media(max-width:600px){
    .exclude-grid{grid-template-columns:1fr;}
}

/* ===== 職業快速 ===== */
.job-quick{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-bottom:10px;
}
.job-quick button{
    font-size:0.85em;
    padding:6px 10px;
}

/* ===== 連抽結果 ===== */
.multi-box{
    width:94%;
    max-width:900px;
    margin:16px auto;
    padding:14px;
    background:#0b1526;
    border:1px solid #3fbfff;
    border-radius:10px;
    display:none;
}

/* ===== 職業頁 ===== */
.job-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:16px;
    width:94%;
    max-width:960px;
    margin:20px auto;
}
.job-card{
    background:#0f1f35;
    border:1px solid #3fbfff;
    border-radius:14px;
    padding:26px 10px;
    cursor:pointer;
    transition:.25s;
}
.job-card:hover{
    transform:translateY(-4px) scale(1.04);
}

/* ===== 職業按鈕 ===== */
#jobBtn{
    position:fixed;
    right:18px;
    top:50%;
    transform:translateY(-50%);
    padding:12px 16px;
    border-radius:40px;
    background:#132a45;
    border:1px solid #66d9ff;
    cursor:pointer;
    z-index:50;
}
@media(max-width:600px){
    #jobBtn{
        top:auto;
        bottom:14px;
        right:50%;
        transform:translateX(50%);
        border-radius:14px;
        padding:14px 26px;
    }
}
</style>
</head>

<body>

<div id="jobBtn" onclick="showPage('job')">職業抽取</div>

<div id="main" class="page active">
<h1>PRTS 隨機 6★ 幹員</h1>

<div id="operator">博士準備好了嗎？</div>

<button onclick="drawOne()">單抽</button>
<button onclick="drawMulti()">連抽</button>
<input id="multiCount" type="number" value="10" min="1" max="12">
<button onclick="resetAll()">重置</button>

<div id="count"></div>
<div id="multiResult" class="multi-box"></div>
<!-- 抽取紀錄 -->
<div class="panel">
  <div class="panel-header" onclick="togglePanel(this)">
    ▼ 抽取紀錄
  </div>
  <div class="panel-content" id="historyList">
    尚未抽取
  </div>
</div>

<div class="panel">
<div class="panel-header" onclick="togglePanel(this)">▼ 排除幹員設定</div>
<div class="panel-content">

<div style="font-size:0.85em;margin-bottom:6px;">
※ 此列表由台服最新到最舊排序
</div>

<div class="job-quick" id="jobQuick"></div>

<button onclick="selectAll(true)">全部排除</button>
<button onclick="selectAll(false)">全部取消</button>
<button onclick="applyExclusion()">套用</button>

<div id="excludeList" class="exclude-grid"></div>
</div>
</div>
</div>

<div id="job" class="page">
<h1>選擇職業</h1>
<div style="font-size:0.85em;opacity:.7;">
※ 按下就能抽取該職業的一名幹員
</div>
<div id="jobGrid" class="job-grid"></div>
<button onclick="showPage('main')">返回</button>
</div>

<script>
/* ===== 音效 ===== */
const sound=new Audio("https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3");
sound.volume=.4;

/* ===== 職業資料 ===== */
const jobs={
先鋒:["忍冬","繆爾賽思","伊內絲","伺夜","焰尾","琴柳","嵯峨","風笛","推進之王"],
近衛:["司霆驚蟄","隱德來希","維娜·維多利亞","佩佩","烏爾比安","左樂","鐧","薇薇安娜","止頌","赫德雷","聖約送葬人","仇白","重岳","瑪恩納","百煉嘉維爾","艾麗妮","耀騎士臨光","帕拉斯","山","史爾特爾","棘刺","煌","赫拉格","陳","斯卡蒂","銀灰"],
狙擊:["蕾繆安","娜仁圖亞","維什戴爾","萊伊","提豐","鴻雪","菲亞梅塔","遠牙","假日威龍陳","ASH","空弦","迷迭香","早露","W","黑","能天使"],
重裝:["信仰攪拌機","餘","黍","滌火傑西卡","斥罪","號角","泥岩","瑕光","森蚺","年","塞雷婭","星熊"],
醫療:["Mon3tr","純燼艾雅法拉","焰影葦草","流明","凱爾希","夜鶯","閃靈"],
輔助:["電弧","酒神","魔王","塑心","淬羽赫默","白鐵","令","靈知","濁心斯卡蒂","鈴蘭","麥哲倫","安潔莉娜"],
術師:["死芒","燭煌","荒蕪拉普蘭德","瑪露西爾","妮芙","邏各斯","霍爾海雅","林","黑鍵","澄閃","卡涅利安","異客","夕","刻俄柏","莫斯提馬","艾雅法拉","伊芙利特"],
特種:["新約能天使","引星棘刺","弒君者","阿斯卡綸","ELA","琳瑯詩懷雅","麒麟R夜刀","緘默德克薩斯","多蘿西","歸溟幽靈鯊","老鯉","水月","歌蕾蒂婭","溫蒂","傀影","阿"]
};

/* ===== 幹員清單（完整，台服最新→最舊） ===== */
const operators=[
"電弧","司霆驚蟄","酒神","新約能天使","信仰攪拌機","Mon3tr","死芒","隱德來希","餘","燭煌",
"引星棘刺","荒蕪拉普蘭德","忍冬","弒君者","維娜·維多利亞","瑪露西爾","佩佩","娜仁圖亞","妮芙",
"烏爾比安","維什戴爾","邏各斯","魔王","阿斯卡綸","ELA","黍","左樂","萊伊","鐧","塑心",
"薇薇安娜","止頌","赫德雷","滌火傑西卡","純燼艾雅法拉","琳瑯詩懷雅","提豐","聖約送葬人",
"繆爾賽思","霍爾海雅","淬羽赫默","伊內絲","麒麟R夜刀","仇白","重岳","林","焰影葦草",
"緘默德克薩斯","斥罪","伺夜","白鐵","瑪恩納","百煉嘉維爾","鴻雪","多蘿西","黑鍵","歸溟幽靈鯊",
"艾麗妮","流明","號角","菲亞梅塔","澄閃","令","老鯉","靈知","耀騎士臨光","焰尾","遠牙",
"琴柳","假日威龍陳","水月","帕拉斯","卡涅利安","濁心斯卡蒂","凱爾希","歌蕾蒂婭","異客",
"ASH","夕","嵯峨","空弦","山","迷迭香","泥岩","瑕光","史爾特爾","森蚺","棘刺","鈴蘭",
"早露","W","溫蒂","傀影","風笛","刻俄柏","年","煌","阿","莫斯提馬","麥哲倫","赫拉格",
"黑","陳","斯卡蒂","銀灰","塞雷婭","星熊","夜鶯","閃靈","安潔莉娜","艾雅法拉","伊芙利特",
"推進之王","能天使"
];

let excluded=new Set(),pool=[],history=[],drawCount=0;
const LS_KEY="prts_excluded_v1";

/* ===== 初始化 ===== */
function initExclude(){
    const box=document.getElementById("excludeList");
    box.innerHTML="";
    const saved=new Set(JSON.parse(localStorage.getItem(LS_KEY)||"[]"));
    operators.forEach(op=>{
        const label=document.createElement("label");
        const cb=document.createElement("input");
        cb.type="checkbox"; cb.value=op;
        if(saved.has(op)){cb.checked=true; excluded.add(op);}
        label.appendChild(cb);
        label.append(" "+op);
        box.appendChild(label);
    });
}
function initJobQuick(){
    jobQuick.innerHTML="";
    Object.keys(jobs).forEach(j=>{
        const b=document.createElement("button");
        b.textContent=j+" 全選";
        b.onclick=()=>{
            document.querySelectorAll("#excludeList input").forEach(cb=>{
                if(jobs[j].includes(cb.value)) cb.checked=true;
            });
        };
        jobQuick.appendChild(b);
    });
}
function resetPool(){
    pool=operators.filter(o=>!excluded.has(o));
    history=[]; drawCount=0;
    updateCount(); updateHistory();
    multiResult.style.display="none";
}
function applyExclusion(){
    excluded.clear();
    document.querySelectorAll("#excludeList input:checked")
        .forEach(cb=>excluded.add(cb.value));
    localStorage.setItem(LS_KEY,JSON.stringify([...excluded]));
    resetPool();
}
function selectAll(v){
    document.querySelectorAll("#excludeList input").forEach(cb=>cb.checked=v);
}
function updateCount(){
    count.innerText=`已抽取：${drawCount} ｜ 剩餘：${pool.length}`;
}
function updateHistory(){
    const box = document.getElementById("historyList");
    if(!box) return;

    if(history.length === 0){
        box.textContent = "尚未抽取";
        return;
    }

    box.innerHTML = "";
    history.slice().reverse().forEach((op, i) => {
        const d = document.createElement("div");
        d.className = "history-item";
        d.textContent = `${history.length - i}. ${op}`;
        box.appendChild(d);
    });
}
function showResult(op){
    operator.innerText=op;
    operator.classList.remove("flash");
    void operator.offsetWidth;
    operator.classList.add("flash");
    history.push(op); drawCount++;
updateCount();
updateHistory();
}
function drawOne(){
    if(!pool.length)return alert("沒有可抽幹員");
    sound.currentTime=0; sound.play();
    showResult(pool.splice(Math.random()*pool.length|0,1)[0]);
}
async function drawMulti(){
    let n=Math.min(12,Math.max(1,parseInt(multiCount.value)||1));
    const results=[];
    sound.currentTime=0; sound.play();
    for(let i=0;i<n;i++){
        if(!pool.length)break;
        const op=pool.splice(Math.random()*pool.length|0,1)[0];
        results.push(op);
        showResult(op);
        await new Promise(r=>setTimeout(r,160));
    }
    if(results.length){
        multiResult.style.display="block";
        multiResult.innerHTML="<b>本次連抽結果：</b><br>"+results.join(" 、 ");
    }
}
function drawByJob(job){
    const list=pool.filter(o=>jobs[job].includes(o));
    if(!list.length)return alert("該職業沒有可抽幹員");
    const op=list[Math.random()*list.length|0];
    pool.splice(pool.indexOf(op),1);
    sound.currentTime=0; sound.play();
    showPage("main");
    showResult(op);
}
function togglePanel(el){
    const c=el.nextElementSibling;
    c.style.display=c.style.display==="block"?"none":"block";
}
function showPage(id){
    document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
    document.getElementById(id).classList.add("active");

    // 控制職業抽取按鈕顯示
    const btn = document.getElementById("jobBtn");
    if(id === "job"){
        btn.style.display = "none";
    }else{
        btn.style.display = "block";
    }
}
function resetAll(){
    excluded.clear(); localStorage.removeItem(LS_KEY);
    document.querySelectorAll("#excludeList input").forEach(cb=>cb.checked=false);
    resetPool(); operator.innerText="博士準備好了嗎？";
}
function initJobGrid(){
    jobGrid.innerHTML="";
    Object.keys(jobs).forEach(j=>{
        const c=document.createElement("div");
        c.className="job-card";
        c.innerHTML=`<h3>${j}</h3><div style="opacity:.7">${jobs[j].length} 位幹員</div>`;
        c.onclick=()=>drawByJob(j);
        jobGrid.appendChild(c);
    });
}

/* ===== 啟動 ===== */
initExclude();
initJobQuick();
resetPool();
initJobGrid();
</script>

</body>
</html>
